name: Keep Supabase Alive

on:
  schedule:
    # 매일 자정에 실행
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  ping-database:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API (debug)
        run: |
          echo "URL 앞부분 확인 (키 노출 방지 위해 일부만): ${SUPABASE_URL:0:20}..."

          response=$(curl -s -w "\n%{http_code}" \
            "${SUPABASE_URL}/rest/v1/restaurants?select=id&limit=1" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "HTTP Status Code: $http_code"
          echo "Response Body: $body"

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 400 ]; then
            echo "Successfully kept Supabase alive!"
          else
            echo "Failed with status code: $http_code"
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
